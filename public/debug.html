<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FENIX Debug</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    .status { padding: 10px; margin: 10px 0; border-radius: 4px; }
    .success { background: #d4edda; color: #155724; }
    .error { background: #f8d7da; color: #721c24; }
  </style>
</head>
<body>
  <h1>FENIX Debug Page</h1>
  <div id="status"></div>
  
  <script>
    console.log('Debug page loaded');
    
    const statusDiv = document.getElementById('status');
    
    function addStatus(message, type = 'success') {
      const div = document.createElement('div');
      div.className = `status ${type}`;
      div.textContent = message;
      statusDiv.appendChild(div);
      console.log(message);
    }
    
    addStatus('Debug page initialized');
    
    // Test basic functionality
    try {
      addStatus('DOM manipulation working');
      
      // Test fetch to API
      fetch('/api/v1/health')
        .then(response => response.json())
        .then(data => {
          addStatus('API health check successful: ' + data.status);
        })
        .catch(error => {
          addStatus('API health check failed: ' + error.message, 'error');
        });
        
      // Test module import
      import('./js/api.js')
        .then(module => {
          addStatus('API module import successful');
          const api = new module.API();
          addStatus('API class instantiated');
        })
        .catch(error => {
          addStatus('API module import failed: ' + error.message, 'error');
        });
        
    } catch (error) {
      addStatus('JavaScript error: ' + error.message, 'error');
    }
  </script>
</body>
</html>
