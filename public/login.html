<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - FENIX Project Manager</title>
  <link rel="stylesheet" href="/css/main.css">
  <style>
    .login-container {
      max-width: 400px;
      margin: 100px auto;
      padding: 40px;
      background-color: white;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }
    .login-header {
      text-align: center;
      margin-bottom: 30px;
    }
    .login-header h1 {
      color: var(--primary);
      margin-bottom: 10px;
    }
    .login-header p {
      color: var(--secondary);
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-label {
      display: block;
      margin-bottom: 5px;
      font-weight: 500;
      color: var(--secondary);
    }
    .form-input {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 4px;
      font-size: 14px;
    }
    .form-input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(255, 153, 0, 0.1);
    }
    .btn {
      width: 100%;
      padding: 12px;
      background-color: var(--primary);
      color: var(--secondary);
      border: none;
      border-radius: 4px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .btn:hover {
      background-color: #EC8B00;
    }
    .btn:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }
    .error-message {
      background-color: #FEE;
      color: var(--error);
      padding: 10px;
      border-radius: 4px;
      margin-bottom: 20px;
      display: none;
    }
    .default-credentials {
      margin-top: 20px;
      padding: 15px;
      background-color: #F7F8F8;
      border-radius: 4px;
      font-size: 12px;
    }
    .default-credentials h3 {
      margin-bottom: 10px;
      color: var(--secondary);
    }
    .default-credentials p {
      margin: 5px 0;
      font-family: monospace;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-header">
      <h1>FENIX</h1>
      <p>Project Manager</p>
    </div>

    <div id="error-message" class="error-message"></div>

    <form id="login-form">
      <div class="form-group">
        <label class="form-label" for="username">Username</label>
        <input type="text" id="username" class="form-input" autocomplete="username" required autofocus>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input type="password" id="password" class="form-input" autocomplete="current-password" required>
      </div>

      <button type="submit" class="btn" id="login-btn">Login</button>
    </form>

    <div class="default-credentials">
      <h3>Default Credentials</h3>
      <p><strong>Admin:</strong> admin / admin123</p>
      <p><strong>User:</strong> user / user123</p>
      <p><strong>Viewer:</strong> viewer / viewer123</p>
    </div>
  </div>

  <script>
    const form = document.getElementById('login-form');
    const errorMessage = document.getElementById('error-message');
    const loginBtn = document.getElementById('login-btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      // Hide error message
      errorMessage.style.display = 'none';
      loginBtn.disabled = true;
      loginBtn.textContent = 'Logging in...';

      try {
        const response = await fetch('/api/v1/auth/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ username, password }),
        });

        console.log('Login response status:', response.status);
        const data = await response.json();
        console.log('Login response data:', data);

        if (!response.ok) {
          throw new Error(data.message || 'Login failed');
        }

        // Store token
        localStorage.setItem('fenix_token', data.token);
        localStorage.setItem('fenix_user', JSON.stringify(data.user));

        console.log('Token stored, redirecting...');
        // Redirect to main app
        window.location.href = '/';

      } catch (error) {
        console.error('Login error:', error);
        errorMessage.textContent = error.message;
        errorMessage.style.display = 'block';
        loginBtn.disabled = false;
        loginBtn.textContent = 'Login';
      }
    });
  </script>
</body>
</html>
