<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FENIX - Download Test</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/components.css">
</head>
<body>
    <div class="container">
        <h1>FENIX Download Test</h1>
        <p>This page helps test and fix download issues.</p>

        <div class="card mb-3">
            <div class="card-header">Recent Files</div>
            <div class="card-body">
                <button id="load-files" class="btn btn-primary">Load Recent Files</button>
                <div id="files-list" class="mt-2"></div>
            </div>
        </div>

        <div class="card mb-3">
            <div class="card-header">Direct Download Test</div>
            <div class="card-body">
                <p>Try downloading these recent PowerPoint files:</p>
                <div class="grid grid-2">
                    <button class="btn btn-outline" onclick="downloadFile('FENIX_Overview_1767793997528.pptx')">
                        📊 FENIX Overview
                    </button>
                    <button class="btn btn-outline" onclick="downloadFile('Fenix_Project_Manager_Overview_1767785577646.pptx')">
                        📈 Project Manager Overview
                    </button>
                    <button class="btn btn-outline" onclick="downloadFile('Fishbone_Quality_Issue_1767706753153.pptx')">
                        🐟 Fishbone Diagram
                    </button>
                    <button class="btn btn-outline" onclick="downloadFile('Test_Multiple_Lanes_1767706753087.pptx')">
                        🗺️ Process Map
                    </button>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-header">Download Status</div>
            <div class="card-body">
                <div id="status-message">Ready to test downloads...</div>
            </div>
        </div>
    </div>

    <script>
        // Get auth token from localStorage
        const token = localStorage.getItem('fenix_token');
        
        if (!token) {
            document.getElementById('status-message').innerHTML = 
                '<div class="alert alert-warning">⚠️ No auth token found. Please <a href="login.html">login</a> first.</div>';
        }

        // Load recent files
        document.getElementById('load-files').addEventListener('click', async () => {
            try {
                const response = await fetch('/api/v1/generate/files/recent', {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const data = await response.json();
                const filesList = document.getElementById('files-list');
                
                if (data.data && data.data.length > 0) {
                    filesList.innerHTML = '<h4>Recent Files:</h4>' + 
                        data.data.map(file => `
                            <div class="file-item mb-2 p-2 border rounded">
                                <strong>${file.filename}</strong><br>
                                <small>Type: ${file.type} | Size: ${(file.size / 1024).toFixed(1)} KB | Created: ${new Date(file.created).toLocaleString()}</small><br>
                                <button class="btn btn-sm btn-primary mt-1" onclick="downloadFileByUrl('${file.downloadUrl}', '${file.filename}')">
                                    📥 Download
                                </button>
                            </div>
                        `).join('');
                } else {
                    filesList.innerHTML = '<p>No recent files found.</p>';
                }

                document.getElementById('status-message').innerHTML = 
                    `<div class="alert alert-success">✅ Loaded ${data.data.length} recent files</div>`;

            } catch (error) {
                console.error('Failed to load files:', error);
                document.getElementById('status-message').innerHTML = 
                    `<div class="alert alert-error">❌ Failed to load files: ${error.message}</div>`;
            }
        });

        // Download file by filename
        async function downloadFile(filename) {
            try {
                document.getElementById('status-message').innerHTML = 
                    `<div class="alert alert-info">📥 Downloading ${filename}...</div>`;

                const response = await fetch(`/api/v1/generate/files/download/${encodeURIComponent(filename)}`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                // Create download link
                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(url);
                document.body.removeChild(a);

                document.getElementById('status-message').innerHTML = 
                    `<div class="alert alert-success">✅ Downloaded ${filename} successfully!</div>`;

            } catch (error) {
                console.error('Download failed:', error);
                document.getElementById('status-message').innerHTML = 
                    `<div class="alert alert-error">❌ Download failed: ${error.message}</div>`;
            }
        }

        // Download file by URL
        async function downloadFileByUrl(url, filename) {
            try {
                document.getElementById('status-message').innerHTML = 
                    `<div class="alert alert-info">📥 Downloading ${filename}...</div>`;

                const response = await fetch(url, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                // Create download link
                const blob = await response.blob();
                const downloadUrl = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = downloadUrl;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(downloadUrl);
                document.body.removeChild(a);

                document.getElementById('status-message').innerHTML = 
                    `<div class="alert alert-success">✅ Downloaded ${filename} successfully!</div>`;

            } catch (error) {
                console.error('Download failed:', error);
                document.getElementById('status-message').innerHTML = 
                    `<div class="alert alert-error">❌ Download failed: ${error.message}</div>`;
            }
        }

        // Auto-load files on page load
        if (token) {
            document.getElementById('load-files').click();
        }
    </script>

    <style>
        .file-item {
            background: #f8f9fa;
            border: 1px solid #dee2e6;
        }
        .alert {
            padding: 10px;
            border-radius: 4px;
            margin: 10px 0;
        }
        .alert-success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .alert-error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .alert-warning { background: #fff3cd; color: #856404; border: 1px solid #ffeaa7; }
        .alert-info { background: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
    </style>
</body>
</html>
