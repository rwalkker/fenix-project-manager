services:
  - type: web
    name: fenix-project-manager
    env: node
    plan: free
    buildCommand: npm install --only=production && node render-build.js
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: AWS_REGION
        value: us-east-1
      - key: LOG_LEVEL
        value: info
      - key: MAX_FILE_SIZE
        value: "10485760"
      - key: UPLOAD_DIR
        value: "/tmp/uploads"
      - key: STORAGE_PATH
        value: "/tmp/fenix-storage"
    # Environment variables to be set in Render dashboard:
    # AWS_ACCESS_KEY_ID - Your AWS access key
    # AWS_SECRET_ACCESS_KEY - Your AWS secret key  
    # JWT_SECRET - Random secure string (generate new)
    # SESSION_SECRET - Random secure string (generate new)